<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>AV Glamour Gown</title>
	<style>
		body { background-color: #0a1a3d; color: #e6eeff; font-family: Arial, Helvetica, sans-serif; margin:0; }
		.navbar { display:flex; gap:16px; align-items:center; padding:14px 22px; background:#091432; position:sticky; top:0; }
		.navbar a { color:#bcd3ff; text-decoration:none; font-weight:600; }
		.navbar .brand { color:#ffffff; font-weight:800; letter-spacing:1px; margin-right:auto; font-size:24px; }
		.container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
		.card-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
		.card { background:#ffffff; border:1px solid #e3e7f5; border-radius:8px; overflow:hidden; color:#0a1a3d; }
		.card img { width:100%; height:220px; object-fit:cover; background:#08102a; }
		.card .content { padding:12px 14px; }
		.badge { background:#14306e; color:#fff; padding:4px 8px; border-radius:4px; font-size:12px; }
		label { color:#e6eeff; }
		input, textarea { background:#0b1d43; color:#e6eeff; border:1px solid #2a457e; border-radius:6px; padding:8px 10px; }
		.button { background:#1a3d8f; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; }
		.footer { text-align:center; color:#8aa5d6; padding:24px; }
		.alert { background:#1b2b5a; border-left:4px solid #3c5db3; padding:8px 12px; border-radius:6px; margin:10px 0; color:#e6eeff; }
		.table { width:100%; border-collapse: collapse; color:#e6eeff; }
		.table th, .table td { border-bottom:1px solid #233a75; padding:8px; text-align:left; }
		.banner { position:relative; border-radius:8px; overflow:hidden; }
		.banner img { width:100%; height:320px; object-fit:cover; display:block; }
		.banner .overlay { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.6)); display:flex; align-items:flex-end; }
		.banner .text { color:#ffffff; padding:16px; }
		.banner .text h3 { margin:0 0 6px 0; font-size:26px; }
	</style>
</head>
<body>
	<div class="navbar">
		<a class="brand" href="{{ url_for('index') }}">AV Glamour Gown</a>
		<form action="{{ url_for('search') }}" method="get" style="margin-left:16px; display:flex; gap:8px;">
			<input name="q" placeholder="Search products" value="{{ request.args.get('q','') }}" />
			<button class="button" type="submit">Search</button>
		</form>
		<a href="{{ url_for('login') }}">Login</a>
		<a href="{{ url_for('signup') }}">Signup</a>
		<a href="{{ url_for('upload') }}">Upload</a>
		{% if session.get('user_id') %}
			<a href="{{ url_for('profile', user_id=session.get('user_id')) }}">Profile</a>
			<a href="{{ url_for('logout') }}">Logout</a>
		{% endif %}
	</div>
	<div class="container">
		{% block content %}{% endblock %}
	</div>
	<div class="footer">© AV Glamour Gown</div>
</body>
</html>
